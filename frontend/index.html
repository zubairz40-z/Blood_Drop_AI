<!doctype html>
<html lang="en" style="background-color: #F7F7F8">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/blood-drop.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="BloodDrop AI is a blood donation coordination platform connecting patients, donors, hospitals, and volunteers through intelligent matching and coordination." />
    <title>BloodDrop AI — Find Blood. Save Lives. Faster.</title>
    <style>
      #blooddrop-boot-loader {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background-color: #F7F7F8;
        transition: opacity 0.25s ease-out;
      }
      #blooddrop-boot-loader.bd-fade-out {
        opacity: 0;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div id="blooddrop-boot-loader">
      <div style="display:flex;flex-direction:column;align-items:center">
        <div style="position:relative;margin-bottom:24px">
          <svg width="32" height="44" viewBox="0 0 32 44" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M16 2C16 2 4 18 4 26C4 32.627 9.373 38 16 38C22.627 38 28 32.627 28 26C28 18 16 2 16 2Z" fill="#DC2626"/>
            <ellipse cx="12" cy="24" rx="3" ry="4" fill="#B91C1C" opacity="0.3"/>
          </svg>
          <div style="position:absolute;left:50%;bottom:-8px;transform:translateX(-50%);width:32px;height:12px;border-radius:50%;border:1px solid rgba(220,38,38,0.3)"></div>
        </div>
        <div style="text-align:center">
          <div style="font-size:20px;font-weight:700;color:#171717;letter-spacing:-0.025em;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif">
            Blood<span style="color:#F72585">Drop</span>
            <span style="display:inline-block;font-size:10px;font-weight:700;background-color:#FDE7F1;color:#F72585;padding:2px 6px;border-radius:9999px;vertical-align:top;position:relative;top:-1px;margin-left:4px">AI</span>
          </div>
          <div style="margin-top:6px;font-size:12px;color:#737373;letter-spacing:0.025em;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif">
            Connecting lives...
          </div>
        </div>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
