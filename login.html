<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login &amp; Register – BloodDrop AI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='0.9em' font-size='90'>&#128171;</text></svg>">
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar">
    <div class="container">
      <a href="index.html" class="logo">
        <span class="logo-icon"><i class="fas fa-droplet"></i></span>
        <span>Blood<b>Drop</b> <b style="color:var(--accent)">AI</b></span>
      </a>
      <button class="nav-toggle" aria-label="Menu"><i class="fas fa-bars"></i></button>
      <div class="nav-links">
        <a href="index.html">Home</a>
        <a href="dashboard.html">Dashboard</a>
        <a href="create-request.html">Create Blood Request</a>
        <a href="donor-dashboard.html">Donor Dashboard</a>
        <a href="hospital-dashboard.html">Hospital Dashboard</a>
        <a href="volunteer-dashboard.html">Volunteer Dashboard</a>
        <a href="admin-dashboard.html">Admin Dashboard</a>
        <a href="funding.html">Funding</a>
      </div>
    </div>
  </nav>

  <div class="auth-wrap">
    <div class="auth-card">
      <a href="index.html" class="logo">
        <span class="logo-icon"><i class="fas fa-droplet"></i></span>
        <span>Blood<b>Drop</b> <b style="color:var(--accent)">AI</b></span>
      </a>
      <p>Sign in or create an account to continue.</p>

      <div class="auth-tabs">
        <button data-tab="login" class="active"><i class="fas fa-sign-in-alt"></i> Login</button>
        <button data-tab="register"><i class="fas fa-user-plus"></i> Register</button>
      </div>

      <!-- Login -->
      <form id="login-form" class="auth-panel active" novalidate>
        <div class="form-group">
          <label for="login-email">Email Address</label>
          <div class="input-icon-wrap">
            <span class="in-icon"><i class="fas fa-envelope"></i></span>
            <input type="email" class="form-control" id="login-email" placeholder="patient@example.com" value="sarah@example.com" required>
          </div>
        </div>
        <div class="form-group">
          <label for="login-password">Password</label>
          <div class="input-icon-wrap">
            <span class="in-icon"><i class="fas fa-lock"></i></span>
            <input type="password" class="form-control" id="login-password" placeholder="••••••••" value="password123" required>
          </div>
        </div>
        <div class="form-group">
          <label>Select Your Role</label>
          <div class="role-grid">
            <label class="role-option">
              <input type="radio" name="role" value="patient" checked>
              <span><i class="fas fa-procedures"></i>Patient</span>
            </label>
            <label class="role-option">
              <input type="radio" name="role" value="donor">
              <span><i class="fas fa-hand-holding-heart"></i>Donor</span>
            </label>
            <label class="role-option">
              <input type="radio" name="role" value="hospital">
              <span><i class="fas fa-hospital"></i>Hospital</span>
            </label>
            <label class="role-option">
              <input type="radio" name="role" value="volunteer">
              <span><i class="fas fa-hands-helping"></i>Volunteer</span>
            </label>
            <label class="role-option">
              <input type="radio" name="role" value="admin">
              <span><i class="fas fa-user-shield"></i>Admin</span>
            </label>
          </div>
        </div>
        <button type="submit" class="btn btn-primary btn-block btn-lg"><i class="fas fa-sign-in-alt"></i> Login</button>
        <p class="auth-alt">Don't have an account? <a href="#" onclick="switchAuthTab && switchAuthTab('register'); return false;">Register here</a></p>
      </form>

      <!-- Register -->
      <form id="register-form" class="auth-panel" novalidate>
        <div class="form-group">
          <label for="reg-name">Full Name</label>
          <div class="input-icon-wrap">
            <span class="in-icon"><i class="fas fa-user"></i></span>
            <input type="text" class="form-control" id="reg-name" placeholder="Rahim Uddin" value="Rahim Uddin" required>
          </div>
        </div>
        <div class="form-group">
          <label for="reg-email">Email Address</label>
          <div class="input-icon-wrap">
            <span class="in-icon"><i class="fas fa-envelope"></i></span>
            <input type="email" class="form-control" id="reg-email" placeholder="donor@example.com" value="rahim@example.com" required>
          </div>
        </div>
        <div class="form-group">
          <label for="reg-password">Password</label>
          <div class="input-icon-wrap">
            <span class="in-icon"><i class="fas fa-lock"></i></span>
            <input type="password" class="form-control" id="reg-password" placeholder="Min. 8 characters" value="password123" required>
          </div>
        </div>
        <div class="form-group">
          <label>I am registering as a</label>
          <div class="role-grid">
            <label class="role-option">
              <input type="radio" name="reg-role" value="patient">
              <span><i class="fas fa-procedures"></i>Patient</span>
            </label>
            <label class="role-option">
              <input type="radio" name="reg-role" value="donor" checked>
              <span><i class="fas fa-hand-holding-heart"></i>Donor</span>
            </label>
            <label class="role-option">
              <input type="radio" name="reg-role" value="hospital">
              <span><i class="fas fa-hospital"></i>Hospital</span>
            </label>
            <label class="role-option">
              <input type="radio" name="reg-role" value="volunteer">
              <span><i class="fas fa-hands-helping"></i>Volunteer</span>
            </label>
            <label class="role-option">
              <input type="radio" name="reg-role" value="admin">
              <span><i class="fas fa-user-shield"></i>Admin</span>
            </label>
          </div>
        </div>
        <button type="submit" class="btn btn-accent btn-block btn-lg"><i class="fas fa-user-plus"></i> Create Account</button>
        <p class="auth-alt">Already have an account? <a href="#" onclick="switchAuthTab && switchAuthTab('login'); return false;">Login</a></p>
      </form>
    </div>
  </div>

  <script src="js/main.js"></script>
</body>
</html>
